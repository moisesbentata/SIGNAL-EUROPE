# Search query used to find European tech/VC/AI tweets via the official
# X API v2 (see signal_europe/sources/twitter_source.py). Uses X's search
# query syntax: https://developer.x.com/en/docs/x-api/tweets/search/integrate/build-a-query
search_query: >
  (europe OR european OR "series a" OR "series b" OR "raises" OR startup)
  (AI OR startup OR funding OR fintech OR "venture capital")
  lang:en -is:retweet

max_results: 15
